name: TEST Full CI
run-name: >-
  ${{ github.event_name == 'pull_request' && github.event.label.name == 'ci:full' && format('Full CI #{0} @{1} on {2}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha) || 'Unrequested label' }}
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: ${{ github.event.label.name == 'ci:full' && format('test-pr-{0}', github.event.pull_request.number) || format('test-label-{0}', github.run_id) }}
  cancel-in-progress: true
jobs:
  native:
    if: github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: sleep 20
  check:
    name: ${{ github.event.label.name == 'ci:full' && 'check' || 'check-not-requested' }}
    if: always() && github.event.label.name == 'ci:full'
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.native.result }}
  full:
    name: ${{ github.event.label.name == 'ci:full' && 'full-ci' || 'ci-not-requested' }}
    if: always() && github.event.label.name == 'ci:full'
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.native.result }}
